name: ci

on:
  push:
    paths:
      - 'src/**'
    # - '.github/workflows/ci.yaml'
    branches:
      - main
  
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Set commit ID
        run: echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Verify COMMIT_ID
        run: |
          echo "GITHUB_SHA = $GITHUB_SHA"
          echo "COMMIT_ID shell = $COMMIT_ID"
          echo "COMMIT_ID context = ${{ env.COMMIT_ID }}"

    #  - name: Set commit ID
    #    id: vars
    #    run: echo "commit_id=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"

      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: leoherso/python-app:${{ env.commit_id }}
         