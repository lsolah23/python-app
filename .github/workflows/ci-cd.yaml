name: ci-cd

on:
  push:
    paths:
      - 'src/**'
    # - '.github/workflows/ci.yaml'
    branches:
      - main
  
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

      - name: Set commit ID
        run: echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"


    #  Another option to set commit ID is to use the GITHUB_OUTPUT variable, but it is commented out in this workflow.    
    #  - name: Set commit ID
    #    id: vars
    #    run: echo "commit_id=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: leoherso/python-app:${{ env.COMMIT_ID }}
          
          # Another option to use the commit ID is to reference it 
          # from steps outputs like this steps.vars.output.commit_id 
          # ${{ steps.vars.outputs.commit_id }}
  
  cd:
    runs-on: self-hosted
    needs: ci
    steps:
    
    
      - name: Argocd app sync
        run: | 
          argocd login https://argocd-server.argocd \ 
            --username admin --insecure \ 
            --grpc-web  \
            --password ${{ secrets.ARGOCD_PASSWORD }}  

            

#         argocd app sync python-app \
#           --revision ${{ env.COMMIT_ID }} \
#           --grpc-web

 