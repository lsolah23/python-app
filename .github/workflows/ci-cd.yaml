name: ci-cd

on:
  push:
    paths:
      - 'src/**'
    # - '.github/workflows/ci.yaml'
    branches:
      - main

permissions:
  contents: write  

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

      - name: Set commit ID
        run: echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"


    #  Another option to set commit ID is to use the GITHUB_OUTPUT variable, but it is commented out in this workflow.    
    #  - name: Set commit ID
    #    id: vars
    #    run: echo "commit_id=${GITHUB_SHA::6}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: leoherso/python-app:${{ env.COMMIT_ID }}
          
          # Another option to use the commit ID is to reference it 
          # from steps outputs like this steps.vars.output.commit_id 
          # ${{ steps.vars.outputs.commit_id }}

#-----------------------------------------------------------------------------
  
  cd:
    runs-on: self-hosted
    needs: ci
    steps:

      - name: Update GitOps image tag
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${IMAGE_TAG:0:6}"

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/lsolah23/python-app.git" \
            app-repo

          cd app-repo

          sed -i -E \
            "s/^([[:space:]]*tag:).*/\1 ${TAG}/" \
            charts/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/values.yaml
          git diff --cached --quiet || git commit -m "ci: deploy python-app ${TAG}"

          git -c credential.helper= push origin HEAD:main
    
      - name: Install argocd
        shell: bash
        run: | 
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod +x argocd 
          sudo mv ./argocd /usr/local/bin/argocd
           
      - name: Argocd app sync
        run: | 
       
          argocd login argocd-server.argocd --username admin --insecure --grpc-web --password ${{ secrets.ARGOCD_PASSWORD }}  
          argocd app sync test-app-py --grpc-web
 